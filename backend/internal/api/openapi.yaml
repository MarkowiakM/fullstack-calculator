openapi: 3.0.3
info:
  title: Fullstack Calculator API
  version: 1.0.0
  description: >
    A single resource-shaped endpoint for arithmetic operations. Operands and
    results are JSON strings, not numbers — a JSON number would decode to
    float64 before the backend's decimal type ever sees it, destroying
    precision. See the README for the full rationale.
servers:
  - url: http://localhost:8000
    description: docker compose
  - url: http://localhost:8080
    description: local (non-Docker) backend

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/calculations:
    post:
      summary: Perform a calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
            examples:
              divide:
                value: { operation: divide, operands: ["10", "3"] }
              sqrt:
                value: { operation: sqrt, operands: ["9"] }
      responses:
        "200":
          description: Calculation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResponse"
              example:
                operation: divide
                operands: ["10", "3"]
                result: "3.3333333333"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unknownOperation:
                  value: { error: { code: UNKNOWN_OPERATION, message: 'unknown operation "modulo"' } }
                wrongArity:
                  value: { error: { code: WRONG_ARITY, message: 'operation "add" requires 2 operand(s), got 1' } }
        "422":
          description: Request is valid, but the operation is not performable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                divisionByZero:
                  value: { error: { code: DIVISION_BY_ZERO, message: "division by zero" } }
                negativeSqrt:
                  value: { error: { code: NEGATIVE_SQRT, message: "square root of a negative number is undefined" } }

components:
  schemas:
    CalculationRequest:
      type: object
      required: [operation, operands]
      properties:
        operation:
          type: string
          enum: [add, subtract, multiply, divide, power, percentage, sqrt]
        operands:
          type: array
          items:
            type: string
          description: >
            Decimal numbers as strings. Two operands for every operation
            except sqrt, which takes one. percentage(a, b) means "a% of b".
    CalculationResponse:
      type: object
      properties:
        operation:
          type: string
        operands:
          type: array
          items:
            type: string
        result:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INVALID_JSON
                - UNKNOWN_OPERATION
                - INVALID_OPERAND
                - WRONG_ARITY
                - DIVISION_BY_ZERO
                - NEGATIVE_SQRT
                - RESULT_OUT_OF_RANGE
                - METHOD_NOT_ALLOWED
                - INTERNAL
            message:
              type: string
