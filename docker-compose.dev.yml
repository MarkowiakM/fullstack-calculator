services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./backend/.env
    ports:
      - "8000:8080"
    volumes:
      - ./backend:/src
      - /src/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src
      - /src/node_modules
    depends_on:
      - backend
