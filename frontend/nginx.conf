server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file path resolves to index.html so client-side
    # routing (and a hard refresh on any route) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access: the browser calls this container's own origin
    # at /api/..., nginx forwards it to the backend container over the
    # compose network. This is what lets the frontend skip CORS and an
    # absolute API URL entirely in the containerized setup.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
